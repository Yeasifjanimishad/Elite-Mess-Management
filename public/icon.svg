<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Card Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#mmsGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />
  
  <!-- Stylized Kitchen Cloche / Plate representing Dining and Ledger -->
  <g transform="translate(128, 128) scale(0.5)">
    <!-- Cloche cover -->
    <path d="M256,120 C140,120 46,200 40,300 L472,300 C466,200 372,120 256,120 Z" fill="url(#mmsGrad)" />
    <!-- Cloche handle -->
    <circle cx="256" cy="90" r="26" fill="url(#mmsGrad)" />
    <rect x="246" y="104" width="20" height="20" fill="url(#mmsGrad)" rx="4" />
    <!-- Plate tray -->
    <path d="M16,320 L496,320 C496,340 460,370 420,370 L92,370 C52,370 16,340 16,320 Z" fill="#334155" />
    <rect x="0" y="310" width="512" height="12" rx="6" fill="#e2e8f0" />
  </g>

  <!-- Community Fork & Spoon silhouettes crossed inside -->
  <g transform="translate(256, 320) scale(0.85)">
    <!-- Fork -->
    <path d="M-50,-10 L-50,-80 M-60,-80 L-60,-40 M-40,-80 L-40,-40 M-50,-10 L-50,40" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <!-- Spoon -->
    <path d="M50,-40 C35,-40 35,-80 50,-80 C65,-80 65,-40 50,-40 Z M50,-40 L50,40" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Minimal decorative node points representing network ledger -->
  <circle cx="100" cy="256" r="10" fill="#10b981" />
  <circle cx="412" cy="256" r="10" fill="#10b981" />
  <circle cx="256" cy="100" r="10" fill="#10b981" />
  <circle cx="256" cy="412" r="10" fill="#10b981" />
  
  <line x1="100" y1="256" x2="160" y2="256" stroke="#10b981" stroke-width="3" opacity="0.5" />
  <line x1="412" y1="256" x2="352" y2="256" stroke="#10b981" stroke-width="3" opacity="0.5" />
  <line x1="256" y1="100" x2="256" y2="160" stroke="#10b981" stroke-width="3" opacity="0.5" />
  <line x1="256" y1="412" x2="256" y2="352" stroke="#10b981" stroke-width="3" opacity="0.5" />
</svg>
